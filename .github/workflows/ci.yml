name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - run: npm ci
      - run: npm test
      - name: Lint PHP
        run: find themes plugins -name '*.php' -print0 | xargs -0 -n1 php -l

