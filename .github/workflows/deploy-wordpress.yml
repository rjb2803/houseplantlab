name: Deploy WordPress files

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect the server or deploy the HouseplantLab folders
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - deploy

permissions:
  contents: read

concurrency:
  group: houseplantlab-production
  cancel-in-progress: false

jobs:
  inspect:
    if: inputs.mode == 'inspect'
    runs-on: ubuntu-24.04
    steps:
      - name: Install FTP client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Inspect likely WordPress paths without changing files
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p 21 "$FTP_HOST" <<'LFTP'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set cmd:fail-exit false
          pwd
          cls -la
          cls -la public_html
          cls -la public_html/wp-content
          cls -la wp-content
          bye
          LFTP

  deploy:
    if: inputs.mode == 'deploy'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Install FTP client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Deploy only HouseplantLab theme and plugin
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p 21 "$FTP_HOST" <<'LFTP'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set net:max-retries 3
          set net:timeout 20
          mkdir -p public_html/wp-content/themes/houseplantlab
          mkdir -p public_html/wp-content/plugins/houseplantlab-core
          mirror --reverse --verbose --only-newer dist/wp-content/themes/houseplantlab public_html/wp-content/themes/houseplantlab
          mirror --reverse --verbose --only-newer dist/wp-content/plugins/houseplantlab-core public_html/wp-content/plugins/houseplantlab-core
          cls -la public_html/wp-content/themes/houseplantlab
          cls -la public_html/wp-content/plugins/houseplantlab-core
          bye
          LFTP

